[package]
name = "storm"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
### terminal stuff ###
clap = { version = "4.6.7", features= ["derive"] } # command line parser
owo-colors = "4.4.0" # ansi color formatter (good for dynamic colors)
color-print = "0.3.7" # ansi color formatter (good for static colors)
colors-transform = "0.2.11" #helps with HSV conversions in some temporary debug printing
#prettytable-rs = "0.10.0"
unicode-width = "0.2.2"

### error handling ###
thiserror = "2.0.21" # error type generation
#error-stack = "0.6.0" # good error handling
#anyhow = { version = "1.0.82", features = ["backtrace"] } # simple error handling

### enums ###
strum = { version = "0.28.0", features = ["derive"], git = "https://github.com/StaterZ/strum" } # get names of enum fields as strings
enum-as-inner = "0.7.0" # unwrap for enum fields without needing annoying pattern matching

### misc ###
#lazy_static = "1.4.0" #init statics at runtime
#phf = { version = "0.14.0", features = ["macros"] } # generate LUTs and other data at comp-time
itertools = "0.15.0" #more iterator utlites
streaming-iterator = "0.1.9" #streaming iterators
more-asserts = "0.3.1" #more asserts
#anymap = "0.12.1" #type map
stopwatch = "0.0.7" #easy timer library

### compiler ###
logos = "0.16.1"
logos-display = "0.1.3"
ariadne = { version = "0.6.0", features = ["auto-color"] }
unescaper = "0.2.0"
lalrpop-util = { version = "0.23.1", default-features = false, features = ["std"] } # runtime support for the generated parser

### LLVM ###
inkwell = { version = "0.10.0", features = ["llvm18-1"] }
#melior = { version = "0.25.0", features = ["ods-dialects", "helpers"] }
#llvm-sys = "201.0.0"
#mlir-sys = "0.4.1"

### custom ###
szu = { version = "0.2.1", path = "../szu" }
tree_printer = { version = "0.1.0", path = "../tree_printer", features = ["derive"] }

[build-dependencies]
lalrpop = "0.23.1" # parser generator

[profile.release]
lto = true
